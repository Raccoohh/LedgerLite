name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: ledgerlite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d ledgerlite_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://test:ephemeral-test-only@localhost:5432/ledgerlite_test
      PROVIDER_API_KEY: ci-provider-only
      WEBHOOK_SECRET: ci-webhook-only
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
